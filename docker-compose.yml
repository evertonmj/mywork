version: "3.9"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: mywork-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb
      - DEBUG=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    container_name: mywork-backend
    environment:
      USE_LOCALSTACK: "true"
      LOCALSTACK_ENDPOINT_URL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "us-east-1"
    depends_on:
      localstack:
        condition: service_healthy
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: "http://backend:8001"
    container_name: mywork-frontend
    environment:
      NODE_ENV: "production"
      PORT: "3001"
    depends_on:
      - backend
    ports:
      - "3001:3001"
